name: edunexa_admin
description: "EduNexa Admin & Teachers mobile app."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter_svg: ^2.3.0
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  url_launcher: ^6.3.0
  http: ^1.2.0
  flutter_secure_storage: ^10.0.0
  share_plus: ^13.0.0
  cross_file: ^0.3.4
  file_selector: ^1.1.0
  pdfrx: 1.3.5
  flutter:
    sdk: flutter
  record: ^7.1.2
  audioplayers: ^6.8.1
  image_picker: ^1.2.4
  path_provider: ^2.1.6
  flutter_local_notifications: ^22.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/illustrations/auth/
    - assets/splash/
    - assets/branding/
    - assets/illustrations/
    - assets/empty_states/
    - assets/icons/
    - assets/motion/
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
