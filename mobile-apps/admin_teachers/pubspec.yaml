name: edunexa_admin
description: "EduNexa Admin & Teachers mobile app."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.0

dependencies:
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  url_launcher: ^6.3.0
  http: ^1.2.0
  flutter_secure_storage: ^10.0.0
  share_plus: ^13.0.0
  cross_file: ^0.3.4
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
