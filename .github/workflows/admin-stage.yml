name: Stage dashboard to Azure

on:
  push:
    branches: [stage]
    paths:
      - "admin-dashboard/**"
      - "deploy/azure/**"
      - ".github/workflows/admin-stage.yml"
  workflow_dispatch:

concurrency:
  group: stage-admin-azure
  cancel-in-progress: false

permissions:
  contents: read

env:
  AZURE_WEBAPP_NAME: edunexa-stage-admin-pragathi
  NODE_VERSION: "24"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  build:
    name: Build dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: admin-dashboard/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build (type-checks the code)
        run: npm run build
        env:
          # Open dashboard tabs compare this with /api/version and reload after a new deployment.
          NEXT_PUBLIC_BUILD_ID: ${{ github.sha }}
      - name: Assemble the server bundle
        run: |
          test -f .next/standalone/server.js || { echo "no .next/standalone/server.js (output: standalone)"; exit 1; }
          cp -R .next/static .next/standalone/.next/static
          cp -R public .next/standalone/public
          rm -f .next/standalone/.env .next/standalone/.env.local
          cd .next/standalone && zip -qry ../../../admin.zip .
          ls -lh ../../../admin.zip
      - uses: actions/upload-artifact@v4
        with:
          name: admin-zip
          path: admin.zip
          retention-days: 30

  deploy:
    if: github.ref == 'refs/heads/stage' && vars.STAGE_DEPLOY_ENABLED == 'true'
    environment: stage
    permissions:
      contents: read
      id-token: write
    name: Deploy to App Service
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: admin-zip
      - name: Sign in to Azure (stage identity only)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_STAGE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_STAGE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_STAGE_SUBSCRIPTION_ID }}
      - name: Deploy
        id: deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: admin.zip
      - name: Check the login page
        env:
          WEBAPP_URL: ${{ steps.deploy.outputs.webapp-url }}
        run: |
          echo "App address: $WEBAPP_URL"
          url="${WEBAPP_URL%/}/portal/login"
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "$url" || true)
            if [ "$code" = "200" ]; then echo "login page: HTTP 200"; exit 0; fi
            echo "waiting for the app to start ($i/30, HTTP $code)"; sleep 10
          done
          echo "Login page did not answer: open the web app > Monitoring > Log stream"; exit 1
