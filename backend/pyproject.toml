[project]
name = "edunexa-backend"
version = "0.1.0"
description = "EduNexa College backend (FastAPI, PostgreSQL on Supabase)"
requires-python = ">=3.12"
# Runtime dependencies. Vercel installs from this file (it takes precedence over
# requirements.txt, which lists the same packages for pip installs).
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "pydantic-settings>=2.6,<3",
    "PyJWT>=2.9,<3",
    "argon2-cffi>=23.1,<26",
    "reportlab>=4,<6",
    "openpyxl>=3.1,<4",
    "cryptography>=44,<51",
    "psycopg[binary]>=3.2,<4",
    "httpx>=0.27,<1",
]

[tool.uv]
# An application, not an installable package: install the dependencies only.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
